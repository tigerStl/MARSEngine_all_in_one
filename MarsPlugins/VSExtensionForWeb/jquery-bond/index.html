<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bond Trade Ticket - jQuery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: #020617; color: #e5e7eb; }
    .shell { min-height: 100vh; display: flex; flex-direction: column; }
    header { padding: 10px 16px; background: radial-gradient(circle at top left, #0ea5e9, #020617); border-bottom: 1px solid #0f172a; display:flex; justify-content:space-between; align-items:center; }
    header h1 { margin: 0; font-size: 16px; color: #f9fafb; }
    header span { font-size: 11px; color: #d1d5db; }
    .toolbar { display:flex; gap:6px; }
    .toolbar button { font-size: 11px; padding:4px 10px; border-radius:999px; border:1px solid #0f172a; background:#020617; color:#e5e7eb; cursor:pointer; }
    .toolbar button.primary { background:#22c55e; border-color:#16a34a; color:#022c22; }
    .toolbar button.danger { background:#b91c1c; border-color:#7f1d1d; color:#fee2e2; }
    main { flex:1; padding:12px 16px 16px; display:grid; grid-template-columns: 2.2fr 1.8fr; gap:12px; }
    .card { background:#020617; border-radius:8px; border:1px solid #1e293b; padding:10px 12px; box-shadow:0 8px 24px rgba(15,23,42,0.8); }
    .card h2 { margin:0 0 6px; font-size:13px; text-transform:uppercase; letter-spacing:0.08em; color:#9ca3af; }
    .form-grid { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:6px 10px; }
    label { display:flex; flex-direction:column; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:#6b7280; }
    input, select { margin-top:2px; padding:4px 6px; border-radius:5px; border:1px solid #1f2937; background:#020617; color:#e5e7eb; font-size:12px; }
    input:focus, select:focus { outline:1px solid #38bdf8; border-color:#38bdf8; }
    .side { display:grid; grid-template-rows:auto 1fr; gap:10px; height:100%; }
    .ticket-summary { font-size:12px; padding:8px; border-radius:6px; border:1px dashed #374151; background:rgba(15,23,42,0.6); }
    table { width:100%; border-collapse:collapse; font-size:11px; margin-top:4px; }
    th, td { padding:4px 4px; border-bottom:1px solid #111827; text-align:left; }
    th { text-transform:uppercase; letter-spacing:0.08em; color:#6b7280; background:#020617; }
    tr:nth-child(even) { background:rgba(15,23,42,0.7); }
    .status { margin-top:6px; font-size:11px; color:#9ca3af; display:flex; justify-content:space-between; }
    .status-pill { padding:2px 8px; border-radius:999px; border:1px solid #374151; background:rgba(15,23,42,0.7); }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>Bond Trade Ticket</h1>
        <span>jQuery demo – cash price / yield / DV01 (simplified)</span>
      </div>
      <div class="toolbar">
        <button class="primary" id="btnPrice">Price</button>
        <button id="btnClear">Clear</button>
        <button class="danger" id="btnCancel">Cancel</button>
      </div>
    </header>
    <main>
      <section class="card">
        <h2>Trade Details</h2>
        <div class="form-grid">
          <label>
            ISIN
            <input id="isin" value="US0000000001" />
          </label>
          <label>
            Side
            <select id="side">
              <option value="BUY">BUY</option>
              <option value="SELL">SELL</option>
            </select>
          </label>
          <label>
            Quantity (MM)
            <input id="qty" type="number" value="5" />
          </label>
          <label>
            Currency
            <select id="ccy">
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
              <option value="GBP">GBP</option>
            </select>
          </label>
          <label>
            Coupon %
            <input id="coupon" type="number" value="3.50" />
          </label>
          <label>
            Maturity
            <input id="maturity" type="date" />
          </label>
          <label>
            Clean Price
            <input id="price" type="number" value="99.25" />
          </label>
          <label>
            Yield %
            <input id="yield" type="number" value="3.65" />
          </label>
          <label>
            Settlement
            <input id="settle" type="date" />
          </label>
        </div>
        <div class="status">
          <span class="status-pill" id="statusText">Ready</span>
          <span>Not a real pricing engine – for UI only</span>
        </div>
      </section>
      <section class="side">
        <div class="card">
          <h2>Ticket Summary</h2>
          <div class="ticket-summary" id="summary">
            Enter trade fields and click <strong>Price</strong>.
          </div>
        </div>
        <div class="card">
          <h2>Risk (Toy)</h2>
          <table>
            <thead>
              <tr>
                <th>Metric</th>
                <th>Value</th>
              </tr>
            </thead>
            <tbody id="riskTable">
              <tr><td>NPV</td><td>-</td></tr>
              <tr><td>Accrued</td><td>-</td></tr>
              <tr><td>DV01</td><td>-</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script>
    function computeRisk() {
      var qty = parseFloat($('#qty').val()) || 0;
      var price = parseFloat($('#price').val()) || 0;
      var coupon = parseFloat($('#coupon').val()) || 0;
      var yld = parseFloat($('#yield').val()) || 0;
      var notional = qty * 1_000_000;
      var cleanNPV = notional * (price / 100);
      var accrued = notional * (coupon/100) * 0.5; // 6 months simple
      var dv01 = notional * 0.0001 * 5; // pretend 5y duration
      return {
        npv: cleanNPV + accrued,
        accrued: accrued,
        dv01: dv01
      };
    }

    function updateSummary() {
      var side = $('#side').val();
      var isin = $('#isin').val();
      var qty = parseFloat($('#qty').val()) || 0;
      var ccy = $('#ccy').val();
      var price = parseFloat($('#price').val()) || 0;
      var yld = parseFloat($('#yield').val()) || 0;
      var coupon = parseFloat($('#coupon').val()) || 0;
      var mty = $('#maturity').val() || 'MAT ?';
      var settle = $('#settle').val() || 'SETTLE ?';
      var notional = qty * 1_000_000;
      var risk = computeRisk();
      $('#summary').html(
        'Trade ' + side + ' ' + qty.toFixed(2) + 'mm ' + isin +
        ' @ ' + price.toFixed(3) + ' (' + yld.toFixed(3) + '%) ' +
        ' coupon ' + coupon.toFixed(3) + '% ' +
        '<br/>Notional ' + notional.toLocaleString() + ' ' + ccy +
        '<br/>Settle ' + settle + ' • Maturity ' + mty +
        '<br/><br/>NPV ≈ ' + risk.npv.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ' + ccy
      );
      $('#riskTable').html(
        '<tr><td>NPV</td><td>' + risk.npv.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ' + ccy + '</td></tr>' +
        '<tr><td>Accrued</td><td>' + risk.accrued.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ' + ccy + '</td></tr>' +
        '<tr><td>DV01</td><td>' + risk.dv01.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ' + ccy + '</td></tr>'
      );
      $('#statusText').text('Priced at ' + price.toFixed(3) + ' / ' + yld.toFixed(3) + '%');
    }

    $(function() {
      var today = new Date().toISOString().slice(0,10);
      $('#maturity').val(new Date(new Date().setFullYear(new Date().getFullYear()+5)).toISOString().slice(0,10));
      $('#settle').val(today);

      $('#btnPrice').on('click', updateSummary);
      $('#btnClear').on('click', function() {
        $('#qty').val('5');
        $('#price').val('99.25');
        $('#yield').val('3.65');
        $('#coupon').val('3.50');
        $('#summary').html('Enter trade fields and click <strong>Price</strong>.');
        $('#riskTable').html('<tr><td>NPV</td><td>-</td></tr><tr><td>Accrued</td><td>-</td></tr><tr><td>DV01</td><td>-</td></tr>');
        $('#statusText').text('Ready');
      });
      $('#btnCancel').on('click', function() {
        alert('Cancel pressed – this would normally close the ticket.');
      });
    });
  </script>
</body>
</html>
