<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mirror page (new window)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Mirror page (new window)</h1>
    <p class="hint">Same URL-relative controls as the index page, on a different document URL, for Playwright disambiguation tests.</p>

    <section class="card" aria-labelledby="mirror-form-title">
      <h2 id="mirror-form-title">Controls matching index</h2>
      <form class="grid-form">
        <label>Text field <input type="text" id="text-field" name="username" autocomplete="username" value="mirror-window-value" /></label>
        <label>Select (native)
          <select id="country-select" name="country">
            <option value="">— choose —</option>
            <option value="us">United States</option>
            <option value="cn">China</option>
            <option value="de">Germany</option>
          </select>
        </label>
      </form>
    </section>
  </main>
</body>
</html>
